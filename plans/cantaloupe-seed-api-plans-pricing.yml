provider: Cantaloupe Seed API
providerId: cantaloupe-seed-api
generated: '2026-09-06'
method: searched
source: >-
  https://www.cantaloupe.com/pricing/ (HTTP 200, fetched 2026-09-06),
  https://www.cantaloupe.com/products/integrations/seed-api/ (HTTP 200)

# 2026-09-06: this file previously contained a bulk-sweep SCAFFOLD — three
# invented tiers (Free 1,000 req/mo, Professional 100,000 req/mo, Enterprise)
# with placeholder prices that Cantaloupe has never published. Replaced with
# the honest measurement below. See roadmap#35.
tags:
  - Payments
  - Vending
  - Pricing
description: >-
  NO PUBLISHED API PLANS. Cantaloupe's pricing page covers hardware and software
  commercial models only — buy the card readers outright, finance them, or take
  the bundled Cantaloupe One subscription — and states "Monthly service fees
  apply" without naming a figure anywhere on the public site. There is no API
  tier, no request quota, no metered rate, and no published price of any kind.
  Access to the Seed API is arranged through the Marketo lead form on the Seed
  API product page ("See what's possible with Seed API" — "Our team will be in
  touch"), so pricing is a sales conversation.
plan_count: 0
pricing_url: https://www.cantaloupe.com/pricing/
pricing_model: contact-sales
published_prices: false
commercial_models:
  - name: Purchase outright
    description: >-
      Buy the hardware and manage it on your balance sheet. "Competitive card
      reader prices", monthly service fees apply, optional add-on services.
    price: not published
  - name: Finance
    description: >-
      Fixed monthly payment on credit approval, monthly service fees apply.
    price: not published
  - name: Cantaloupe One
    description: >-
      Bundled subscription — $0 upfront cost, fixed monthly bundled fees,
      extended warranty for the term, option to bundle additional services.
      Detail page https://www.cantaloupe.com/pricing/cantaloupe-one/ returned
      403 to our crawler on 2026-09-06 (edge bot policy, page exists).
    price: not published
  - name: Cantaloupe Capital
    description: Working-capital financing product, separate from API access.
    price: not published
plans: []

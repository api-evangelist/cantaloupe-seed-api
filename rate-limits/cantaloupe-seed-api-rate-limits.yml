specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Cantaloupe Seed API
providerId: cantaloupe-seed-api
generated: '2026-09-06'
method: searched
source: >-
  https://www.cantaloupe.com/products/integrations/seed-api/,
  https://www.cantaloupe.com/help-center/ (93 help articles, none about the
  API), https://www.cantaloupe.com/status/; live probe of
  https://api.mycantaloupe.com/Reports/Run (401, no RateLimit-* headers).
created: '2026-05-04'
modified: '2026-09-06'
# 2026-09-06: this file previously contained a bulk-sweep SCAFFOLD — invented
# per-tier limits (10 rpm free / 100 rpm pro / 1000 rpm enterprise) and an
# invented X-RateLimit-* header set that Cantaloupe has never published.
# Replaced with the honest measurement below. See roadmap#35.
tags:
  - Rate Limiting
  - Payments
  - Vending
description: >-
  NO PUBLISHED RATE LIMITS. Cantaloupe publishes no API reference, so there is
  no documented limit, window, burst, or quota for the Seed API or the Spotlight
  reporting API. Nor is there a runtime signal an agent could read: the one
  reachable endpoint answers 401 before any rate-limit header is emitted, and no
  RateLimit-*, X-RateLimit-* or Retry-After header appears on the anonymous
  response. An honest zero, measured 2026-09-06.
limit_count: 0
documented: false
headers: {}
responseCodes: {}
limits: []
observed:
  - url: https://api.mycantaloupe.com/Reports/Run
    status: 401
    rate_limit_headers: none
    fetched: '2026-09-06'
  - url: https://api.seedlive.com/
    status: 403
    rate_limit_headers: none
    fetched: '2026-09-06'
notes: >-
  The third-party clope client retries with exponential backoff on timeouts and
  network errors only — it has no 429 handling — which is weak corroboration
  that callers are not routinely throttled with a documented code.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

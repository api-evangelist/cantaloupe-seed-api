apis:
  - aid: cantaloupe-seed-api:cantaloupe-seed-api
    name: Cantaloupe Seed API
    description: >-
      Seed API connects a vending operator's POS and machine fleet to
      Cantaloupe's cashless gateway and reporting cloud. It compiles
      transactions, fees, and payments into a single bill across vending,
      micro markets, and office coffee and pantry services, and surfaces
      real-time sales data as comprehensive reports covering performance,
      payment mix, and profitability.
    humanURL: https://www.cantaloupe.com/products/integrations/seed-api/
    baseURL: https://api.mycantaloupe.com
    tags:
      - Billing
      - Cashless Payments
      - Payments
      - Vending
    properties:
      - type: Documentation
        url: https://www.cantaloupe.com/products/integrations/seed-api/
      - type: Website
        url: https://www.cantaloupe.com/products/integrations/seed-api/
      - type: Support
        url: https://www.cantaloupe.com/help-center/
    x-features:
      - POS integration to Cantaloupe's cashless cloud gateway
      - Accepts debit/credit, mobile and digital wallets, and NFC
      - Single-gateway processing for major card brands
      - Consolidated billing across vending, micro markets, and office coffee
      - Real-time sales data and reporting
      - Payment-type analytics (cash vs cashless vs wallet)
      - Profitability reporting across channels
      - Fleet-wide transaction and fee reconciliation
    x-use-cases:
      - Enabling cashless acceptance on existing vending machines
      - Unifying sales reporting across micro markets and vending
      - Reconciling transactions, fees, and payouts in a single bill
      - Monitoring machine and route performance in real time
      - Analyzing payment type mix and channel profitability
      - Integrating vending data into accounting or ERP systems

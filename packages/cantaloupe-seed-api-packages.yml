description: >-
  NO FIRST-PARTY SDK. Cantaloupe publishes no client libraries for the Seed API
  or the Spotlight reporting API on any public package registry, and its own
  site has no developer/SDK page (see x-coverage in apis.yml). The one library
  that exists is a third-party wrapper written by an operator, recorded here
  because it is the only public, dated, machine-readable evidence of how the
  Cantaloupe API is actually called. No `SDKs` pointer is emitted in apis.yml:
  sdk_count measures FIRST-PARTY libraries, and this is not one.
official_sdk_count: 0
